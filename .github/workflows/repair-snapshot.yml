name: Repair the 2026-10-04 snapshot

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: database-backup-37197300779
          run-id: 37197300779
          github-token: ${{ github.token }}
          path: backup
      - name: Verify and restore the known-good first baseline
        run: |
          test -n "$DATABASE_URL" && test -n "$BACKUP_ENCRYPTION_KEY"
          python3 -m pip install 'cryptography>=45,<47'
          python3 scripts/backup_crypto.py decrypt backup/database.dump.enc backup/database.dump
          test "$(head -c 5 backup/database.dump)" = PGDMP
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD/backup:/backup" postgres:18 \
            pg_restore --list /backup/database.dump >/dev/null
          docker run --rm --user "$(id -u):$(id -g)" \
            --env DATABASE_URL --env PGSSLMODE \
            --volume "$PWD/backup:/backup" postgres:18 \
            sh -c 'pg_restore --single-transaction --exit-on-error --clean --if-exists --no-owner --no-acl --dbname="$DATABASE_URL" /backup/database.dump'
          rm backup/database.dump
