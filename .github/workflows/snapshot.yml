name: OpenPOI nationwide snapshot

on:
  workflow_dispatch:
    inputs:
      snapshot_key:
        description: Optional unique key for a fresh nationwide baseline
        required: false
        type: string
  schedule:
    # OpenPOI's JFF data refreshes weekly; run Monday at 12:00 JST.
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: openpoi-nationwide-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      STORAGE_MODE: ${{ vars.STORAGE_MODE || 'database' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEETS_SPREADSHEET_ID: ${{ vars.SHEETS_SPREADSHEET_ID }}
      MANUAL_SNAPSHOT_KEY: ${{ inputs.snapshot_key }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Validate storage configuration
        run: |
          if [ "$STORAGE_MODE" = database ]; then
            test -n "$DATABASE_URL" && test -n "$BACKUP_ENCRYPTION_KEY"
          elif [ "$STORAGE_MODE" = sheets ]; then
            test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" && test -n "$SHEETS_SPREADSHEET_ID"
          else
            echo "STORAGE_MODE must be database or sheets" >&2
            exit 1
          fi
      - name: Apply database migration
        if: env.STORAGE_MODE == 'database'
        run: python -m collector migrate
      - name: Collect and compare all prefectures
        run: |
          SNAPSHOT_KEY="${MANUAL_SNAPSHOT_KEY:-openpoi-$(date -u +%G-W%V)}"
          python -m collector snapshot --source openpoi --prefecture 全国 --snapshot-key "$SNAPSHOT_KEY"
      - name: Create encrypted PostgreSQL backup
        if: env.STORAGE_MODE == 'database'
        run: |
          python -m pip install 'cryptography>=45,<47'
          mkdir -p backup
          docker run --rm --user "$(id -u):$(id -g)" \
            --env DATABASE_URL --env PGSSLMODE \
            --volume "$PWD/backup:/backup" postgres:18 \
            sh -c 'pg_dump --format=custom --compress=9 --no-owner --no-acl --dbname="$DATABASE_URL" --file=/backup/database.dump && pg_restore --list /backup/database.dump >/dev/null'
          python scripts/backup_crypto.py encrypt backup/database.dump backup/database.dump.enc
          python scripts/backup_crypto.py decrypt backup/database.dump.enc backup/verify.dump
          cmp backup/database.dump backup/verify.dump
          rm backup/database.dump backup/verify.dump
      - name: Retain encrypted backup for 90 days
        if: env.STORAGE_MODE == 'database'
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: backup/database.dump.enc
          if-no-files-found: error
          retention-days: 90
