name: Migrate store master to Google Sheets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEETS_SPREADSHEET_ID: ${{ vars.SHEETS_SPREADSHEET_ID }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Validate migration configuration
        run: test -n "$DATABASE_URL" && test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" && test -n "$SHEETS_SPREADSHEET_ID"
      - name: Migrate existing store and closure data
        run: python -m collector migrate-to-sheets
